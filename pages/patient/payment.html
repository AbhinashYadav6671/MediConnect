<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make Payment | MediConnect</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .pay-method {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
    }
    .pay-method.selected { border-color: var(--mid-green); background: var(--pale-green); }
    .pay-method-left { display: flex; align-items: center; gap: 10px; }
    .pay-method i.fa-credit-card { font-size: 18px; color: var(--mid-green); width: 22px; }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-area" id="content-area"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../../js/session.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/validate.js"></script>
  <script>
    requireAuth('patient');
    renderDashboardShell({ role: 'patient', navItems: PATIENT_NAV, activeHref: 'appointments.html', pageTitle: 'Make Payment' });

    const appointmentId = new URLSearchParams(window.location.search).get('appointmentId');
    const appt = MediConnectDB.getAppointmentById(appointmentId);
    const contentArea = document.getElementById('content-area');
    const patient = appt ? MediConnectDB.getPatientById(appt.patientId) : null;

    if (!appt || appt.paymentStatus === 'paid') {
      contentArea.innerHTML = `
        <div class="card empty-state">
          <i class="fa-solid fa-circle-check"></i>
          <h4>${!appt ? 'Appointment not found' : 'This appointment is already paid'}</h4>
          <p><a href="appointments.html">Go back to Appointments</a></p>
        </div>`;
    } else {
      const doctor = MediConnectDB.getDoctorById(appt.doctorId);
      contentArea.innerHTML = `
        <div style="display:flex; gap:20px; flex-wrap:wrap; max-width:800px;">
          <div class="card" style="flex:1; min-width:240px;">
            <div class="card-header"><h3>Appointment Details</h3></div>
            <p style="font-size:13.5px; margin-bottom:10px;"><strong>Doctor:</strong><br>${doctor.name}</p>
            <p style="font-size:13.5px; margin-bottom:10px;"><strong>Specialization:</strong><br>${doctor.specialization}</p>
            <p style="font-size:13.5px; margin-bottom:10px;"><strong>Date:</strong><br>${appt.date}</p>
            <p style="font-size:13.5px; margin-bottom:16px;"><strong>Time:</strong><br>${appt.time}</p>
            <div class="card" style="background:var(--pale-green); border:none; display:flex; justify-content:space-between;">
              <strong>Total Amount</strong><strong>Rs. ${doctor.fee}</strong>
            </div>
          </div>

          <div class="card" style="flex:1.3; min-width:300px;">
            <div class="card-header"><h3>Make Payment</h3></div>

            <div class="pay-method selected" data-method="card">
              <div class="pay-method-left"><i class="fa-solid fa-credit-card"></i> Credit / Debit Card</div>
            </div>
            <div class="pay-method" data-method="esewa">
              <div class="pay-method-left"><span class="brand-logo-esewa"><i class="fa-solid fa-wallet"></i> eSewa</span></div>
            </div>
            <div class="pay-method" data-method="khalti">
              <div class="pay-method-left"><span class="brand-logo-khalti"><i class="fa-solid fa-wallet"></i> Khalti</span></div>
            </div>

            <!-- Card fields -->
            <div id="card-fields">
              <div class="form-group">
                <label class="form-label">Cardholder Name</label>
                <input type="text" class="form-input" id="card-name" placeholder="Enter cardholder name">
              </div>
              <div class="form-group">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-input" id="card-number" placeholder="XXXX XXXX XXXX XXXX">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Expiry Date</label>
                  <input type="text" class="form-input" id="card-expiry" placeholder="MM/YY">
                </div>
                <div class="form-group">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-input" id="card-cvv" placeholder="XXX">
                </div>
              </div>
            </div>

            <!-- eSewa gateway simulation -->
            <div id="esewa-fields" style="display:none;">
              <div class="gateway-panel esewa">
                <span class="brand-logo-esewa"><i class="fa-solid fa-wallet"></i> eSewa</span>
                <p style="font-size:12.5px; color:var(--text-gray); margin:10px 0;">Log in with your eSewa ID to complete this payment.</p>
                <div class="form-group">
                  <label class="form-label">eSewa ID (Mobile Number)</label>
                  <input type="text" class="form-input" id="esewa-id" value="${patient.phone || ''}" placeholder="98XXXXXXXX">
                </div>
                <div class="form-group">
                  <label class="form-label">MPIN</label>
                  <input type="password" class="form-input" id="esewa-pin" placeholder="Enter 4-digit MPIN" maxlength="4">
                </div>
                <div class="gateway-redirect-note"><i class="fa-solid fa-lock"></i> Securely connecting to esewa.com.np</div>
              </div>
            </div>

            <!-- Khalti gateway simulation -->
            <div id="khalti-fields" style="display:none;">
              <div class="gateway-panel khalti">
                <span class="brand-logo-khalti"><i class="fa-solid fa-wallet"></i> Khalti</span>
                <p style="font-size:12.5px; color:var(--text-gray); margin:10px 0;">Log in with your Khalti account to complete this payment.</p>
                <div class="form-group">
                  <label class="form-label">Khalti ID (Mobile Number)</label>
                  <input type="text" class="form-input" id="khalti-id" value="${patient.phone || ''}" placeholder="98XXXXXXXX">
                </div>
                <div class="form-group">
                  <label class="form-label">PIN</label>
                  <input type="password" class="form-input" id="khalti-pin" placeholder="Enter PIN" maxlength="6">
                </div>
                <div class="gateway-redirect-note"><i class="fa-solid fa-lock"></i> Securely connecting to khalti.com</div>
              </div>
            </div>

            <button class="btn btn-primary" style="width:100%; margin-top:14px;" id="pay-btn">Pay Rs. ${doctor.fee}</button>
            <p style="text-align:center; font-size:11.5px; color:var(--text-gray); margin-top:10px;">
              <i class="fa-solid fa-lock"></i> Your payment information is not stored (demo prototype).
            </p>
          </div>
        </div>
      `;

      let selectedMethod = 'card';
      const panels = { card: 'card-fields', esewa: 'esewa-fields', khalti: 'khalti-fields' };

      document.querySelectorAll('.pay-method').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
          el.classList.add('selected');
          selectedMethod = el.dataset.method;
          Object.values(panels).forEach(id => document.getElementById(id).style.display = 'none');
          document.getElementById(panels[selectedMethod]).style.display = 'block';
        });
      });

      document.getElementById('pay-btn').addEventListener('click', () => {
        if (selectedMethod === 'card') {
          clearAllFieldErrors(['card-name', 'card-number', 'card-expiry', 'card-cvv']);
          const name = document.getElementById('card-name').value.trim();
          const number = document.getElementById('card-number').value.trim();
          const expiry = document.getElementById('card-expiry').value.trim();
          const cvv = document.getElementById('card-cvv').value.trim();
          if (!name) { setFieldError('card-name', 'Required.'); return; }
          if (number.replace(/\s/g, '').length < 12) { setFieldError('card-number', 'Enter a valid card number.'); return; }
          if (!expiry) { setFieldError('card-expiry', 'Required.'); return; }
          if (cvv.length < 3) { setFieldError('card-cvv', 'Required.'); return; }
        } else if (selectedMethod === 'esewa') {
          clearAllFieldErrors(['esewa-id', 'esewa-pin']);
          const id = document.getElementById('esewa-id').value.trim();
          const pin = document.getElementById('esewa-pin').value.trim();
          if (id.length < 7) { setFieldError('esewa-id', 'Enter a valid eSewa ID.'); return; }
          if (pin.length !== 4) { setFieldError('esewa-pin', 'MPIN must be 4 digits.'); return; }
        } else if (selectedMethod === 'khalti') {
          clearAllFieldErrors(['khalti-id', 'khalti-pin']);
          const id = document.getElementById('khalti-id').value.trim();
          const pin = document.getElementById('khalti-pin').value.trim();
          if (id.length < 7) { setFieldError('khalti-id', 'Enter a valid Khalti ID.'); return; }
          if (pin.length < 4) { setFieldError('khalti-pin', 'Enter your PIN.'); return; }
        }

        const methodLabel = selectedMethod === 'card' ? 'Credit/Debit Card' : selectedMethod === 'esewa' ? 'eSewa' : 'Khalti';
        const payBtn = document.getElementById('pay-btn');
        payBtn.disabled = true;
        payBtn.textContent = selectedMethod === 'card' ? 'Processing...' : 'Connecting to ' + methodLabel + '...';

        setTimeout(() => {
          MediConnectDB.payForAppointment(appt.id, { method: methodLabel });
          window.location.href = `payment-success.html?appointmentId=${appt.id}`;
        }, 1100);
      });
    }
  </script>
</body>
</html>
