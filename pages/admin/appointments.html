<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointment Management | MediConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-area">
        <div class="filter-row">
          <select class="form-select" id="status-filter">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="card table-wrap">
          <table class="table">
            <thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../../js/session.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/loading.js"></script>
  <script>
    requireAuth('admin');
    renderDashboardShell({ role: 'admin', navItems: ADMIN_NAV, activeHref: 'appointments.html', pageTitle: 'Appointment Management' });

    function render() {
      const status = document.getElementById('status-filter').value;
      const list = MediConnectDB.getAppointments(status ? { status } : {});

      document.getElementById('tbody').innerHTML = list.map(a => {
        const p = MediConnectDB.getPatientById(a.patientId);
        const d = MediConnectDB.getDoctorById(a.doctorId);
        const canCancel = a.status === 'pending' || a.status === 'confirmed';
        return `
          <tr>
            <td>${p ? p.name : 'Unknown'}</td>
            <td>${d ? d.name : 'Unknown'}</td>
            <td>${a.date}</td>
            <td><span class="badge badge-${a.status}">${a.status}</span></td>
            <td class="flex-row gap-sm">
  <button class="btn btn-outline action-btn-sm" onclick="viewAppointmentDetails('${a.id}')">View</button>
  ${(a.status === 'pending' || a.status === 'confirmed') ? `<button class="btn btn-outline action-btn-sm" onclick="cancelAppt('${a.id}')">Cancel</button>` : ''}
          </tr>`;
      }).join('');
    }
 
   function cancelAppt(id) {
  confirmAction('Cancel this appointment?', () => {
    MediConnectDB.updateAppointmentStatus(id, 'cancelled');
    showToast('Appointment cancelled.');
    render();
  });
}

    document.getElementById('status-filter').addEventListener('change', render);
   render();
  </script>
</body>
</html>
